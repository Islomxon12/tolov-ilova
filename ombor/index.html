<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Import ombor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #f1f2f6);
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
    --text: var(--tg-theme-text-color, #15171c);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --accent: var(--tg-theme-button-color, #2f80ed);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --head: var(--tg-theme-section-header-text-color, var(--tg-theme-hint-color, #6d7380));
    --line: color-mix(in srgb, var(--hint) 22%, transparent);
    --red: #e5484d;
    --green: #2b9a66;
    --amber: #d98a00;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: 12px 12px calc(84px + env(safe-area-inset-bottom)); }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hint { color: var(--hint); font-size: 13px; }
  .red { color: var(--red); } .green { color: var(--green); } .amber { color: var(--amber); }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    color: var(--head); margin: 18px 4px 8px; display: flex; justify-content: space-between; }
  .card { background: var(--card); border-radius: var(--radius); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; }
  .row + .row { border-top: 1px solid var(--line); }
  .grow { flex: 1; min-width: 0; }
  .ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title { font-size: 20px; font-weight: 700; margin: 2px 4px 4px; }

  input { width: 100%; font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; outline: none; }
  input:focus { border-color: var(--accent); }
  label.f { display: block; margin: 14px 4px 6px; font-size: 13px; color: var(--head); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
  .seg button { border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit;
    padding: 10px 8px; border-radius: 12px; }
  .seg button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--card)); color: var(--accent); font-weight: 600; }
  .sugg { margin: 6px 4px 0; }

  /* Mahsulot qidiruv natijalari */
  .res { margin-top: 6px; }
  .res .row { cursor: pointer; }
  .res .row:active { background: var(--line); }
  .plus { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-weight: 700; font-size: 18px; }
  .qol { font-size: 13px; flex: none; text-align: right; }

  /* Tanlangan mahsulotlar */
  .item .nm { font-weight: 500; }
  .item .soni { width: 86px; flex: none; text-align: right; padding: 9px 10px; font-weight: 600; }
  .item .x { border: 0; background: none; color: var(--hint); font-size: 20px; padding: 0 2px; flex: none; }
  .empty { padding: 16px; text-align: center; color: var(--hint); }
  .total { font-weight: 700; background: color-mix(in srgb, var(--accent) 7%, transparent); }

  .btn { width: 100%; margin-top: 16px; border: 0; border-radius: 12px; padding: 14px; font: inherit; font-weight: 600;
    background: var(--accent); color: var(--accent-text); }
  .btn.sec { background: color-mix(in srgb, var(--accent) 12%, var(--card)); color: var(--accent); }
  .btn:disabled { opacity: .5; }

  /* Qoldiq */
  .hero { padding: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .hero .big { font-size: 22px; font-weight: 700; }
  .chips { display: flex; gap: 8px; margin: 12px 0 0; }
  .chips button { border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; font-size: 14px;
    padding: 7px 14px; border-radius: 20px; }
  .chips button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--card)); color: var(--accent); font-weight: 600; }
  .ql { font-weight: 700; flex: none; }

  [hidden] { display: none !important; }

  /* Tarix */
  .day { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 4px 8px;
    font-size: 13px; font-weight: 600; color: var(--head); }
  .day .d { text-transform: none; letter-spacing: 0; font-size: 15px; color: var(--text); }
  .grp { font-weight: 600; background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .tline { cursor: pointer; }
  .tline:active { background: var(--line); }
  .tline .pen { color: var(--hint); font-size: 14px; flex: none; }
  .card + .card { margin-top: 8px; }

  /* Tuzatish oynasi */
  .ov { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; }
  .sheet { background: var(--bg); width: 100%; max-height: 92vh; overflow: auto; border-radius: 18px 18px 0 0;
    padding: 16px 14px calc(18px + env(safe-area-inset-bottom)); }
  .sheet .res { position: relative; }
  .btn.red { background: color-mix(in srgb, var(--red) 12%, var(--card)); color: var(--red); }
  .btn.ghost { background: none; color: var(--hint); margin-top: 6px; }
  .warn { margin: 10px 4px 0; font-size: 13px; }

  nav { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr;
    background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav button { border: 0; background: none; font: inherit; font-size: 12px; color: var(--hint); padding: 8px 0 10px; }
  nav button .ic { display: block; font-size: 22px; line-height: 1.2; }
  nav button.on { color: var(--accent); font-weight: 600; }

  .msg { padding: 28px 16px; text-align: center; color: var(--hint); }
  .spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent);
    animation: sp .8s linear infinite; margin: 0 auto 10px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--text); color: var(--card); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: 90%;
    opacity: 0; transition: opacity .2s; pointer-events: none; text-align: center; }
  .toast.on { opacity: .95; }
</style>
</head>
<body>
<div id="app"><div class="msg"><div class="spin"></div>Yuklanmoqda…</div></div>
<nav id="nav" hidden>
  <button data-tab="kirim" class="on"><span class="ic">📥</span>Kirim</button>
  <button data-tab="sotuv"><span class="ic">📤</span>Sotuv</button>
  <button data-tab="qoldiq"><span class="ic">📦</span>Qoldiq</button>
  <button data-tab="tarix"><span class="ic">📋</span>Tarix</button>
</nav>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
// Apps Script web app (@yassim_skladbot) — Telegram imzosini tekshirib, "Import Ombor 2026" jadvaliga yozadi
const API = 'https://script.google.com/macros/s/AKfycbxswkTlJhmNIkxCzGnjvr8KL7Uw0_-D58bsRJkjNHkuy1Qp2P_OWbbrJloT_wNOSCSw/exec';
const tg = window.Telegram && Telegram.WebApp;
const app = document.getElementById('app');
const S = { tab: 'kirim', mahsulotlar: [], klientlar: [], menejerlar: [], bugun: '',
  f: { kirim: { qator: [] }, sotuv: { qator: [] } } };

if (tg) { tg.ready(); tg.expand(); }

const fmt = n => (n < 0 ? '−' : '') + Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => String(s).toLowerCase().replace(/[ʻʼ’'`"]/g, '').replace(/ё/g, 'е').replace(/[^a-zа-я0-9]+/g, ' ').trim();
const qolRang = n => n < 0 ? 'red' : n <= 20 ? 'amber' : 'hint';

function toast(t) {
  const el = document.getElementById('toast');
  el.textContent = t; el.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 3000);
}

async function api(act, data) {
  // text/plain — CORS preflight bo'lmasin (Apps Script OPTIONS ga javob bermaydi)
  const r = await fetch(API, { method: 'POST', body: JSON.stringify({ initData: tg ? tg.initData : '', act, ...data }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.xato || 'Xato');
  return j;
}

async function yukla() {
  const j = await api('royxat');
  Object.assign(S, { mahsulotlar: j.mahsulotlar, klientlar: j.klientlar, menejerlar: j.menejerlar, bugun: j.bugun });
}

async function boshla() {
  if (!tg || !tg.initData) {
    app.innerHTML = '<div class="msg">Bu ilova Telegram ichida, @yassim_skladbot menyusidagi <b>Ilova</b> tugmasi orqali ochiladi.</div>';
    return;
  }
  app.innerHTML = '<div class="msg"><div class="spin"></div>Yuklanmoqda…</div>';
  try {
    await yukla();
    document.getElementById('nav').hidden = false;
    korsat();
  } catch (e) {
    app.innerHTML = `<div class="msg">⚠️ ${esc(e.message || e)}<br><br><button class="btn sec" onclick="boshla()">Qayta urinish</button></div>`;
  }
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  S.tab = b.dataset.tab;
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  korsat(); window.scrollTo(0, 0);
  if (S.tab === 'qoldiq') yangila();
  if (S.tab === 'tarix') tarixYangila();
});

/* ---------- Tarix: kunma-kun kirim / sotuv, tuzatish va o'chirish ---------- */
S.t = { tur: 'kirim', davr: '30', q: '', rows: { kirim: null, sotuv: null } };
const UZ_KUN = ['Yakshanba', 'Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba', 'Juma', 'Shanba'];
const sanaObj = s => { const [d, m, y] = String(s).split(/[.\/]/); return new Date(+y, +m - 1, +d); };
const isoDan = s => { const [d, m, y] = String(s).split(/[.\/]/); return `${y}-${m}-${d}`; };
const isoGa = iso => { const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; };

async function tarixYangila() {
  const tur = S.t.tur;
  try {
    const j = await api('tarix', { tur });
    S.t.rows[tur] = j.qatorlar;
    if (S.tab === 'tarix' && S.t.tur === tur) tarixKorsat();
  } catch (e) { toast('⚠️ ' + e.message); }
}

function tarixKorsat() {
  const t = S.t, kirim = t.tur === 'kirim', rows = t.rows[t.tur];
  let body = '';
  if (!rows) body = '<div class="msg"><div class="spin"></div>Yuklanmoqda…</div>';
  else {
    const bugun = sanaObj(S.bugun), chegara = t.davr === 'all' ? null : new Date(bugun.getTime() - (+t.davr - 1) * 86400000);
    const words = norm(t.q) ? norm(t.q).split(' ') : [];
    const list = rows
      .filter(r => !chegara || sanaObj(r.sana) >= chegara)
      .filter(r => words.every(w => norm(r.nom + ' ' + (r.yetk || '') + ' ' + (r.klient || '') + ' ' + (r.menejer || '')).includes(w)))
      .sort((a, b) => sanaObj(b.sana) - sanaObj(a.sana) || b.row - a.row);
    const jami = list.reduce((a, r) => a + r.soni, 0);
    const kunlar = [];
    list.forEach(r => {
      let k = kunlar[kunlar.length - 1];
      if (!k || k.sana !== r.sana) kunlar.push(k = { sana: r.sana, guruh: [], jami: 0 });
      const key = kirim ? (r.yetk || '—') : r.klient + (r.menejer ? ' · ' + r.menejer : '');
      let g = k.guruh.find(x => x.key === key);
      if (!g) k.guruh.push(g = { key, qator: [], jami: 0 });
      g.qator.push(r); g.jami += r.soni; k.jami += r.soni;
    });
    body = `
      <div class="card hero">
        <div><div class="big num">${fmt(jami)}</div><div class="hint">jami kb</div></div>
        <div><div class="big num">${list.length}</div><div class="hint">yozuv</div></div>
        <div><div class="big num">${kunlar.length}</div><div class="hint">kun</div></div>
      </div>
      ${kunlar.length ? kunlar.map(k => `
        <div class="day"><span class="d">${UZ_KUN[sanaObj(k.sana).getDay()]}, ${esc(k.sana)}</span><span class="num">${fmt(k.jami)} kb</span></div>
        ${k.guruh.map(g => `<div class="card">
          <div class="row grp"><div class="grow ell">${kirim ? '📥' : '👤'} ${esc(g.key)}</div><div class="num">${fmt(g.jami)} kb</div></div>
          ${g.qator.map(r => `<div class="row tline" data-r="${r.row}">
            <div class="grow ell">${esc(r.nom)}</div><div class="ql num">${fmt(r.soni)}</div><div class="pen">✏️</div></div>`).join('')}
        </div>`).join('')}`).join('')
      : '<div class="card"><div class="empty">Bu davrda yozuv yo\'q</div></div>'}
      <div class="hint" style="margin:12px 4px">✏️ Qatorni bosing — sonini, mahsulotini, sanasini tuzatish yoki o'chirish</div>`;
  }
  app.innerHTML = `
    <div class="title">📋 Tarix</div>
    <div class="seg" id="tt">
      <button data-t="kirim" class="${kirim ? 'on' : ''}">📥 Kirim</button>
      <button data-t="sotuv" class="${kirim ? '' : 'on'}">📤 Sotuv</button>
    </div>
    <div class="chips" id="td">
      <button data-d="7" class="${t.davr === '7' ? 'on' : ''}">7 kun</button>
      <button data-d="30" class="${t.davr === '30' ? 'on' : ''}">30 kun</button>
      <button data-d="all" class="${t.davr === 'all' ? 'on' : ''}">Hammasi</button>
    </div>
    <div style="margin-top:10px"><input id="tq" type="search" placeholder="🔎 ${kirim ? 'Mahsulot yoki yetkazuvchi' : 'Mahsulot, klient yoki menejer'}" value="${esc(t.q)}" autocomplete="off"></div>
    ${body}`;
  app.querySelectorAll('#tt button').forEach(b => b.onclick = () => {
    t.tur = b.dataset.t; tarixKorsat(); if (!t.rows[t.tur]) tarixYangila();
  });
  app.querySelectorAll('#td button').forEach(b => b.onclick = () => { t.davr = b.dataset.d; tarixKorsat(); });
  const inp = document.getElementById('tq');
  inp.oninput = () => { t.q = inp.value; const p = inp.selectionStart; tarixKorsat(); const x = document.getElementById('tq'); x.focus(); x.setSelectionRange(p, p); };
  app.querySelectorAll('.tline').forEach(el => el.onclick = () => tahrir(+el.dataset.r));
}

function tahrir(row) {
  const t = S.t, tur = t.tur, kirim = tur === 'kirim', r = t.rows[tur].find(x => x.row === row);
  if (!r) return;
  const st = { nom: r.nom, soni: r.soni, sana: isoDan(r.sana), yetk: r.yetk || '', klient: r.klient || '', menejer: r.menejer || '' };
  const box = document.getElementById('modal');
  const yetklar = [...new Set((t.rows.kirim || []).map(x => x.yetk).filter(Boolean))];
  box.innerHTML = `<div class="ov" id="ov"><div class="sheet">
    <div class="title">✏️ ${kirim ? 'Kirimni' : 'Sotuvni'} tuzatish</div>
    <div class="hint" style="margin:0 4px">Jadval ${row}-qator · yozgan: ${esc(r.yozgan || '—')}</div>
    <div class="two">
      <div><label class="f">Sana</label><input id="esn" type="date" value="${st.sana}" max="${isoBugun()}"></div>
      <div><label class="f">Soni</label><input id="esq" class="num" inputmode="numeric" value="${st.soni}"></div>
    </div>
    <label class="f">Mahsulot</label><input id="enm" value="${esc(st.nom)}" autocomplete="off">
    <div class="card res" id="enr" hidden></div>
    <label class="f">${kirim ? 'Qayerdan (yetkazuvchi)' : 'Klient'}</label><input id="ekl" value="${esc(kirim ? st.yetk : st.klient)}" autocomplete="off">
    <div class="card res" id="ekr" hidden></div>
    <div class="hint sugg" id="ekh"></div>
    <div class="warn" id="ewr"></div>
    <button class="btn" id="esave">💾 Saqlash</button>
    <button class="btn red" id="edel">🗑 O'chirish</button>
    <button class="btn ghost" id="eno">Bekor</button>
  </div></div>`;
  const $ = id => document.getElementById(id);
  const yop = () => { box.innerHTML = ''; };
  $('ov').onclick = e => { if (e.target.id === 'ov') yop(); };
  $('eno').onclick = yop;

  // Qoldiq qanday o'zgarishi (tuzatishdan keyin)
  const ogoh = () => {
    const q = (nom, delta) => qoldiqi(nom) + delta;
    const ishora = kirim ? 1 : -1, s = [];
    if (norm(st.nom) === norm(r.nom)) {
      const keyin = q(r.nom, ishora * (st.soni - r.soni));
      s.push(`${esc(r.nom)}: qoldiq ${fmt(qoldiqi(r.nom))} → <b class="${qolRang(keyin)}">${fmt(keyin)}</b>`);
    } else {
      const eskiK = q(r.nom, -ishora * r.soni), yangiK = q(st.nom, ishora * st.soni);
      s.push(`${esc(r.nom)}: ${fmt(qoldiqi(r.nom))} → <b class="${qolRang(eskiK)}">${fmt(eskiK)}</b>`);
      if (S.mahsulotlar.some(p => norm(p.nom) === norm(st.nom)))
        s.push(`${esc(st.nom)}: ${fmt(qoldiqi(st.nom))} → <b class="${qolRang(yangiK)}">${fmt(yangiK)}</b>`);
    }
    $('ewr').innerHTML = s.join('<br>');
  };
  const klHint = () => {
    if (kirim) return;
    const k = klientTop(st.klient);
    $('ekh').innerHTML = !st.klient ? '' : k ? `Menejer: <b>${esc(k.menejer || '—')}</b>`
      : `🆕 Yangi klient — ro'yxatga qo'shiladi${st.menejer ? ` (menejer: ${esc(st.menejer)})` : ''}`;
  };
  const taklif = (inp, boxId, items, tanla) => {
    const b = $(boxId), n = norm(inp.value), w = n ? n.split(' ') : [];
    const mos = n ? items.filter(x => w.every(z => norm(x.t).includes(z)) && norm(x.t) !== n).slice(0, 7) : [];
    if (!mos.length) { b.hidden = true; return; }
    b.innerHTML = mos.map((x, i) => `<div class="row" data-i="${i}"><div class="grow ell">${esc(x.t)}</div><div class="hint">${esc(x.h || '')}</div></div>`).join('');
    b.hidden = false;
    b.querySelectorAll('.row').forEach(el => el.onmousedown = el.onclick = e => { e.preventDefault(); tanla(mos[+el.dataset.i].t); b.hidden = true; });
  };

  $('esn').onchange = e => st.sana = e.target.value;
  $('esq').oninput = e => { e.target.value = e.target.value.replace(/\D/g, ''); st.soni = Number(e.target.value) || 0; ogoh(); };
  const nm = $('enm');
  nm.oninput = () => { st.nom = nm.value.trim(); ogoh();
    taklif(nm, 'enr', S.mahsulotlar.map(p => ({ t: p.nom, h: fmt(p.qoldiq) + ' kb' })), v => { st.nom = nm.value = v; ogoh(); }); };
  nm.onblur = () => setTimeout(() => $('enr') && ($('enr').hidden = true), 150);
  const kl = $('ekl');
  kl.oninput = () => {
    if (kirim) { st.yetk = kl.value.trim(); taklif(kl, 'ekr', yetklar.map(x => ({ t: x })), v => { st.yetk = kl.value = v; }); }
    else { st.klient = kl.value.trim(); klHint();
      taklif(kl, 'ekr', S.klientlar.map(k => ({ t: k.klient, h: k.menejer })), v => { st.klient = kl.value = v; klHint(); }); }
  };
  kl.onblur = () => setTimeout(() => $('ekr') && ($('ekr').hidden = true), 150);
  ogoh(); klHint();

  const eskiMatn = `${r.sana} · ${r.nom} — ${fmt(r.soni)}` + (kirim ? (r.yetk ? ' · ' + r.yetk : '') : ' · ' + r.klient);
  const sor = (matn, ish) => {
    const q = matn.length > 250 ? matn.slice(0, 247) + '…' : matn;
    if (tg && tg.showConfirm) tg.showConfirm(q, ok => ok && ish()); else if (confirm(matn)) ish();
  };
  const bajar = async (data, btn, yozuv) => {
    btn.disabled = true; btn.textContent = 'Saqlanmoqda…';
    try {
      await api('tuzat', { tur, row, eski: { sana: r.sana, nom: r.nom, soni: r.soni }, ...data });
      if (tg) tg.HapticFeedback.notificationOccurred('success');
      yop();
      await Promise.all([yukla(), tarixYangila()]);
      toast(yozuv);
    } catch (e) {
      if (tg) tg.HapticFeedback.notificationOccurred('error');
      toast('⚠️ ' + e.message); btn.disabled = false; btn.textContent = btn.dataset.t;
    }
  };
  $('esave').dataset.t = '💾 Saqlash'; $('edel').dataset.t = '🗑 O\'chirish';
  $('esave').onclick = () => {
    if (!st.sana) return toast('Sanani tanlang');
    if (!(st.soni > 0)) return toast('Sonini yozing');
    const p = S.mahsulotlar.find(x => norm(x.nom) === norm(st.nom));
    if (!p) return toast('Mahsulotni ro\'yxatdan tanlang');
    if (!kirim && !st.klient) return toast('Klientni yozing');
    st.nom = p.nom;
    const sana = isoGa(st.sana);
    const yangiMatn = `${sana} · ${st.nom} — ${fmt(st.soni)}` + (kirim ? (st.yetk ? ' · ' + st.yetk : '') : ' · ' + st.klient);
    if (yangiMatn === eskiMatn && (kirim || norm(st.klient) === norm(r.klient))) return toast('Hech narsa o\'zgarmadi');
    sor(`Eski: ${eskiMatn}\nYangi: ${yangiMatn}\n\nSaqlansinmi?`, () => bajar({
      yangi: { sana, nom: st.nom, soni: st.soni, yetk: st.yetk, klient: st.klient, menejer: st.menejer }
    }, $('esave'), '✅ Tuzatildi'));
  };
  $('edel').onclick = () => sor(`${eskiMatn}\n\nShu yozuv o'chirilsinmi? Qoldiq qayta hisoblanadi.`,
    () => bajar({ ochir: true }, $('edel'), '🗑 O\'chirildi'));
}

/* ---------- Qoldiq ---------- */
S.qf = 'bor'; S.qq = '';

async function yangila() {
  // Qoldiq oynasi ochilganda jadvaldan yangi raqamlar olinadi
  try { await yukla(); if (S.tab === 'qoldiq') qoldiqKorsat(); } catch (e) { toast('⚠️ ' + e.message); }
}

function qoldiqKorsat() {
  const all = S.mahsulotlar, n = norm(S.qq), words = n ? n.split(' ') : [];
  const bor = all.filter(p => p.qoldiq > 0), kam = all.filter(p => p.qoldiq <= 20 && (p.qoldiq < 0 || p.qoldiq > 0));
  const jami = bor.reduce((a, p) => a + p.qoldiq, 0);
  let list = S.qf === 'bor' ? bor : S.qf === 'kam' ? kam : all;
  list = list.filter(p => words.every(w => norm(p.nom).includes(w)));
  app.innerHTML = `
    <div class="title">📦 Qoldiq</div>
    <div class="card hero">
      <div><div class="big num">${fmt(jami)}</div><div class="hint">jami kb</div></div>
      <div><div class="big num">${bor.length}</div><div class="hint">xil bor</div></div>
      <div><div class="big num amber">${kam.length}</div><div class="hint">kam / minus</div></div>
    </div>
    <div class="chips">
      <button data-f="bor" class="${S.qf === 'bor' ? 'on' : ''}">Bor</button>
      <button data-f="kam" class="${S.qf === 'kam' ? 'on' : ''}">Kam / minus</button>
      <button data-f="all" class="${S.qf === 'all' ? 'on' : ''}">Hammasi</button>
    </div>
    <div style="margin-top:10px"><input id="qq" type="search" placeholder="🔎 Mahsulot qidirish" value="${esc(S.qq)}" autocomplete="off"></div>
    <h2><span>Mahsulotlar</span><span>${list.length} ta</span></h2>
    <div class="card">${list.length ? list.map(p => `
      <div class="row"><div class="grow ell">${p.qoldiq < 0 ? '🔴 ' : p.qoldiq > 0 && p.qoldiq <= 20 ? '🟡 ' : ''}${esc(p.nom)}</div>
        <div class="ql num ${p.qoldiq < 0 ? 'red' : p.qoldiq <= 20 ? 'amber' : ''}">${fmt(p.qoldiq)} <span class="hint">kb</span></div></div>`).join('')
      : '<div class="empty">Topilmadi</div>'}</div>
    <div class="hint" style="margin:10px 4px">🟡 20 kb va undan kam · 🔴 minus · ${esc(S.bugun)} holatiga</div>`;
  app.querySelectorAll('.chips button').forEach(b => b.onclick = () => { S.qf = b.dataset.f; qoldiqKorsat(); });
  const inp = document.getElementById('qq');
  inp.oninput = () => { S.qq = inp.value; const p = inp.selectionStart; qoldiqKorsat(); const x = document.getElementById('qq'); x.focus(); x.setSelectionRange(p, p); };
}

const isoBugun = () => { const [d, m, y] = S.bugun.split('.'); return `${y}-${m}-${d}`; };
const qoldiqi = nom => { const p = S.mahsulotlar.find(x => x.nom === nom); return p ? p.qoldiq : 0; };

function korsat() {
  if (S.tab === 'qoldiq') return qoldiqKorsat();
  if (S.tab === 'tarix') return tarixKorsat();
  const kirim = S.tab === 'kirim', f = S.f[S.tab];
  if (!f.sana) f.sana = isoBugun();
  app.innerHTML = `
    <div class="title">${kirim ? '📥 Kirim' : '📤 Sotuv'}</div>
    <div class="two">
      <div><label class="f">Sana</label><input id="sn" type="date" value="${f.sana}" max="${isoBugun()}"></div>
      ${kirim
        ? `<div><label class="f">Qayerdan</label><input id="yt" maxlength="60" placeholder="Xitoy" value="${esc(f.yetk || '')}"></div>`
        : `<div><label class="f">Klient</label><input id="kl" placeholder="Nomini yozing" value="${esc(f.klient || '')}" autocomplete="off"></div>`}
    </div>
    ${kirim ? '' : `<div class="card res" id="klr"></div><div class="hint sugg" id="klh"></div><div id="mn"></div>`}
    ${kirim ? qidiruvHtml('Mahsulot qo\'shish') : ''}
    <h2><span>Mahsulotlar</span><span id="cnt"></span></h2>
    <div class="card" id="items"></div>
    <button class="btn" id="ok">✅ Yozish</button>
    ${kirim ? '' : qidiruvHtml('Omborda bor mahsulotlar — bosib qo\'shing')}`;

  document.getElementById('sn').onchange = e => f.sana = e.target.value;
  if (kirim) document.getElementById('yt').oninput = e => f.yetk = e.target.value;
  else {
    const kl = document.getElementById('kl');
    kl.oninput = () => { f.klient = kl.value.trim(); klientTaklif(); klientHint(); };
    kl.onblur = () => setTimeout(() => { document.getElementById('klr').style.display = 'none'; }, 150);
    klientTaklif(true); klientHint();
  }
  const q = document.getElementById('q');
  q.oninput = () => natijalar(q.value);
  document.getElementById('ok').onclick = yuborish;
  natijalar('');
  qatorlar();
}

// Klient: ro'yxatdan tanlash yoki qo'lda yozish (yozilgan yangi nom yozuvda Klientlar ga qo'shiladi)
const klientTop = nom => S.klientlar.find(x => norm(x.klient) === norm(nom));

function klientTaklif(yashir) {
  const f = S.f.sotuv, box = document.getElementById('klr'), n = norm(f.klient || '');
  if (yashir || !n || klientTop(f.klient)) { box.style.display = 'none'; return; }
  const words = n.split(' ');
  const mos = S.klientlar.filter(k => words.every(w => norm(k.klient).includes(w))).slice(0, 6);
  if (!mos.length) { box.style.display = 'none'; return; }
  box.innerHTML = mos.map(k => `<div class="row" data-k="${esc(k.klient)}"><div class="grow ell">${esc(k.klient)}</div>
    <div class="hint">${esc(k.menejer || '')}</div></div>`).join('');
  box.style.display = '';
  box.querySelectorAll('.row').forEach(el => el.onmousedown = el.onclick = e => {
    e.preventDefault();
    f.klient = el.dataset.k; document.getElementById('kl').value = f.klient;
    box.style.display = 'none'; klientHint();
  });
}

const qidiruvHtml = sarlavha => `<label class="f">${sarlavha}</label>
  <input id="q" type="search" placeholder="🔎 Nomini yozing" autocomplete="off">
  <div class="card res" id="res"></div>`;

function klientHint() {
  const f = S.f.sotuv, k = klientTop(f.klient || '');
  const h = document.getElementById('klh'), mn = document.getElementById('mn');
  if (!f.klient) { h.textContent = ''; mn.innerHTML = ''; return; }
  if (k) { h.innerHTML = `Menejer: <b>${esc(k.menejer || '—')}</b>`; mn.innerHTML = ''; f.menejer = ''; return; }
  h.innerHTML = '🆕 Yangi klient — yozilganda ro\'yxatga qo\'shiladi. Menejer (ixtiyoriy):';
  mn.innerHTML = `<div class="seg">${S.menejerlar.map(m => `<button data-m="${esc(m)}" class="${m === f.menejer ? 'on' : ''}">${esc(m)}</button>`).join('')}</div>`;
  mn.querySelectorAll('button').forEach(b => b.onclick = () => { f.menejer = f.menejer === b.dataset.m ? '' : b.dataset.m; klientHint(); });
}

function natijalar(matn) {
  const f = S.f[S.tab], box = document.getElementById('res'), n = norm(matn);
  const tanlangan = new Set(f.qator.map(r => r.nom));
  const sotuv = S.tab === 'sotuv';
  // Sotuvda qidiruv bo'sh bo'lsa — omborda bor (qoldiq > 0) hamma mahsulot ko'rinib turadi
  if (!n && !sotuv) { box.innerHTML = ''; box.style.display = 'none'; return; }
  const words = n ? n.split(' ') : [];
  let mos = S.mahsulotlar.filter(p => !tanlangan.has(p.nom) && words.every(w => norm(p.nom).includes(w)));
  if (sotuv) mos = n ? mos.filter(p => p.qoldiq > 0).concat(mos.filter(p => p.qoldiq <= 0)).slice(0, 12)
                     : mos.filter(p => p.qoldiq > 0);
  else mos = mos.slice(0, 8);
  const aniq = S.mahsulotlar.some(p => norm(p.nom) === n);
  let html = mos.map(p => `
    <div class="row" data-n="${esc(p.nom)}"><div class="plus">+</div>
      <div class="grow ell">${esc(p.nom)}</div><div class="qol num ${qolRang(p.qoldiq)}">${fmt(p.qoldiq)} kb</div></div>`).join('');
  if (S.tab === 'kirim' && n && !aniq) html += `
    <div class="row" data-yangi="${esc(matn.trim())}"><div class="plus">🆕</div>
      <div class="grow ell">«${esc(matn.trim())}» — yangi mahsulot</div></div>`;
  if (!html) html = `<div class="empty">${n ? 'Topilmadi' : 'Omborda qoldig\'i bor mahsulot yo\'q'}</div>`;
  box.innerHTML = html; box.style.display = '';
  box.querySelectorAll('.row').forEach(el => el.onclick = () => qosh(el.dataset.n || el.dataset.yangi, !!el.dataset.yangi));
}

function qosh(nom, yangi) {
  const f = S.f[S.tab];
  f.qator.push({ nom, soni: 0, yangi });
  const q = document.getElementById('q'); q.value = ''; natijalar('');
  qatorlar();
  const inp = document.querySelectorAll('#items .soni'); inp[inp.length - 1].focus();
}

function qatorlar() {
  const f = S.f[S.tab], kirim = S.tab === 'kirim', box = document.getElementById('items');
  if (!f.qator.length) { box.innerHTML = '<div class="empty">Hali mahsulot qo\'shilmagan</div>'; document.getElementById('cnt').textContent = ''; return; }
  box.innerHTML = f.qator.map((r, i) => {
    const bor = qoldiqi(r.nom), keyin = kirim ? bor + r.soni : bor - r.soni;
    return `<div class="row item">
      <div class="grow"><div class="nm ell">${r.yangi ? '🆕 ' : ''}${esc(r.nom)}</div>
        <div class="hint num" id="h${i}">qoldiq ${fmt(bor)} → <b class="${qolRang(keyin)}">${fmt(keyin)}</b></div></div>
      <input class="soni num" data-i="${i}" inputmode="numeric" placeholder="soni" value="${r.soni || ''}">
      <button class="x" data-i="${i}" aria-label="Olib tashlash">✕</button></div>`;
  }).join('') + `<div class="row total"><div class="grow">Jami</div><div class="num" id="jm"></div></div>`;
  box.querySelectorAll('.soni').forEach(inp => inp.oninput = () => {
    const i = +inp.dataset.i, raqam = inp.value.replace(/\D/g, '');
    inp.value = raqam; f.qator[i].soni = Number(raqam) || 0;
    const bor = qoldiqi(f.qator[i].nom), keyin = kirim ? bor + f.qator[i].soni : bor - f.qator[i].soni;
    document.getElementById('h' + i).innerHTML = `qoldiq ${fmt(bor)} → <b class="${qolRang(keyin)}">${fmt(keyin)}</b>`;
    jami();
  });
  box.querySelectorAll('.x').forEach(b => b.onclick = () => { f.qator.splice(+b.dataset.i, 1); qatorlar(); });
  jami();
}

function jami() {
  const f = S.f[S.tab], s = f.qator.reduce((a, r) => a + r.soni, 0);
  document.getElementById('jm').textContent = fmt(s) + ' kb';
  document.getElementById('cnt').textContent = f.qator.length + ' xil';
}

function yuborish() {
  const tur = S.tab, f = S.f[tur];
  if (!f.sana) return toast('Sanani tanlang');
  if (tur === 'sotuv') {
    if (!f.klient) return toast('Klientni yozing');
  }
  if (!f.qator.length) return toast('Mahsulot qo\'shing');
  const bosh = f.qator.find(r => !r.soni);
  if (bosh) return toast(`${bosh.nom} — sonini yozing`);
  const minus = tur === 'sotuv' ? f.qator.filter(r => qoldiqi(r.nom) - r.soni < 0) : [];
  const [y, m, d] = f.sana.split('-'), sana = `${d}.${m}.${y}`;
  const s = f.qator.reduce((a, r) => a + r.soni, 0);
  const yangiK = tur === 'sotuv' && !klientTop(f.klient) ? ' (yangi klient)' : '';
  const savol = `${tur === 'kirim' ? 'KIRIM' + (f.yetk ? ' · ' + f.yetk : '') : 'SOTUV · ' + f.klient + yangiK} · ${sana}\n` +
    `${f.qator.length} xil, jami ${fmt(s)} kb` +
    (minus.length ? `\n\n⚠️ Omborda yetmaydi: ${minus.map(r => r.nom).join(', ')}` : '') + '\n\nYozilsinmi?';
  const bajar = async ok => {
    if (!ok) return;
    const btn = document.getElementById('ok');
    btn.disabled = true; btn.textContent = 'Yozilmoqda…';
    try {
      const j = await api(tur, { sana, yetk: f.yetk || '', klient: f.klient || '', menejer: f.menejer || '',
        qatorlar: f.qator.map(r => ({ nom: r.nom, soni: r.soni })) });
      if (tg) tg.HapticFeedback.notificationOccurred('success');
      S.f[tur] = { qator: [] };
      await yukla();
      korsat();
      toast(`✅ Yozildi: ${j.sheet} ${j.from}–${j.to} qator, jami ${fmt(j.jami)} kb`);
    } catch (e) {
      if (tg) tg.HapticFeedback.notificationOccurred('error');
      toast('⚠️ ' + e.message);
      btn.disabled = false; btn.textContent = '✅ Yozish';
    }
  };
  // Telegram popup matni 256 belgidan oshmasin
  const qisqa = savol.length > 250 ? savol.slice(0, 235) + '…\n\nYozilsinmi?' : savol;
  if (tg && tg.showConfirm) tg.showConfirm(qisqa, bajar); else bajar(confirm(savol));
}

boshla();
</script>
</body>
</html>
